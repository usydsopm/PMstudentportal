<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample course plan — School of Project Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
/*
  FONTS: Apercu Pro (body) and Lyon Display (headings) are licensed fonts.
  To self-host: place the font files in a /fonts/ folder alongside this HTML
  file and uncomment the @font-face blocks below. Until then the tool falls
  back to system fonts that are visually close.

  @font-face {
    font-family: 'Apercu Pro';
    src: url('fonts/ApercuPro-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Apercu Pro';
    src: url('fonts/ApercuPro-Medium.woff2') format('woff2');
    font-weight: 500 600; font-style: normal;
  }
  @font-face {
    font-family: 'Apercu Pro';
    src: url('fonts/ApercuPro-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal;
  }
  @font-face {
    font-family: 'Lyon Display';
    src: url('fonts/LyonDisplay-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal;
  }
*/
:root {
  --font-body: 'Apercu Pro', 'Helvetica Neue', Arial, sans-serif;
  --font-heading: 'Lyon Display', 'Lyon Display Medium', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
}
:root {
  --usyd-red:#e64626; --usyd-warm:#fcede2; --usyd-dark:#2b1a14;
  --core-bg:#e4fae5; --core-border:#adf3ab;
  --elective-bg:#d4f6ff; --elective-border:#72d3fa;
  --construction-bg:#fff4e6; --construction-border:#f58509;
  --rested-bg:#F2F3F4; --rested-border:#AAB7B8;
  --bg:#fcede2; --surface:#FFFFFF; --border:#e8d5c9;
  --text:#2b1a14; --text-muted:#7a5548;
  --plo-open:#ffb7c8; --plo-secured:#fd689a;
  --plo-open-plo:#f7f175; --plo-secured-plo:#adf3ab;
  --plo-miss:#f2f5fa; --plo-miss-text:#aab3c0;
  --unit-code-color:#414042;
  --hub0:#f58509; --hub1:#10cdf6; --hub2:#117A65; --hub3:#8a5e2d; --hub4:#6739b3;
}
.badge{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 4px;border-radius:3px;}
.badge-s1{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;}
.badge-s2{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80;}
.badge-tbc{background:#F0F0F0;color:#666666;border:1px solid #CCCCCC;}
.badge-permission{background:#FDE8E8;color:#B91C1C;border:1px solid #F5B5B5;}
:root{
  /* Core (discipline) unit tiles */
  --pg-tech-bg:#e4fae5; --pg-tech-border:#adf3ab; --pg-tech-text:#22682D;
  --pg-lead-bg:#d4f6ff; --pg-lead-border:#72d3fa; --pg-lead-text:#2A4B5C;
  --pg-strat-bg:#fff4e6; --pg-strat-border:#f58509; --pg-strat-text:#92592E;
  /* Generic fallback (Thesis units, open elective slots — units that don't
     belong to a single Technical/Leadership/Strategic discipline). */
  --pg-thesis-bg:#a2d9c7; --pg-thesis-border:#26A69A; --pg-thesis-text:#00413B;
  /* Elective Bank tiles */
  --pg-tech-eb-bg:#f0fdf1; --pg-tech-eb-border:#adf3ab; --pg-tech-eb-text:#366E47;
  --pg-lead-eb-bg:#eafbff; --pg-lead-eb-border:#72d3fa; --pg-lead-eb-text:#296E82;
  --pg-strat-eb-bg:#fff9f0; --pg-strat-eb-border:#f58509; --pg-strat-eb-text:#906335;
  /* Light grey signals "draggable" on both the bank tiles and the open slots. */
  --pg-elective-grey-bg:#eeeeee; --pg-elective-grey-border:#bdbdbd; --pg-elective-grey-text:#5a5a5a;
}
.pg-sem-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;container-type:inline-size;}
.pg-sem-title{font-family:var(--font-heading);font-size:15px;font-weight:500;margin-bottom:10px;color:var(--text);}
.pg-sem-units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:stretch;}
@container (max-width:780px){
  .pg-sem-units{grid-template-columns:repeat(2,1fr);}
}
@container (max-width:360px){
  .pg-sem-units{grid-template-columns:1fr;}
}
.pg-unit{border-radius:6px;border:2.5px solid;padding:8px 10px;min-height:138px;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.pg-unit-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;}
.pg-unit-code{font-family:var(--font-mono);font-size:11px;font-weight:700;}
.pg-unit-badges{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0;}
.pg-unit-name{font-size:11.5px;font-weight:500;margin-top:2px;line-height:1.3;}
.pg-unit-note{font-size:9.5px;margin-top:3px;opacity:.85;line-height:1.25;}
.pg-unit.pg-tech{background:var(--pg-tech-bg);border-color:var(--pg-tech-border);color:var(--pg-tech-text);}
.pg-unit.pg-lead{background:var(--pg-lead-bg);border-color:var(--pg-lead-border);color:var(--pg-lead-text);}
.pg-unit.pg-strat{background:var(--pg-strat-bg);border-color:var(--pg-strat-border);color:var(--pg-strat-text);}
.pg-unit.pg-thesis{background:var(--pg-thesis-bg);border-color:var(--pg-thesis-border);color:var(--pg-thesis-text);}
.pg-elective-slot{background:var(--pg-elective-grey-bg);border:2.5px dashed var(--pg-elective-grey-border);border-radius:6px;padding:8px 10px;min-height:138px;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:var(--pg-elective-grey-text);font-style:italic;line-height:1.3;transition:background .12s,border-color .12s;}
.pg-milestone{background:var(--usyd-warm);border:1.5px dashed var(--usyd-red);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:11px;line-height:1.5;}
.pg-milestone b{color:var(--usyd-red);}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:transparent;}
body{font-family:var(--font-body);color:var(--text);font-size:14px;line-height:1.5;padding:2px;}
#embed-root{display:flex;flex-direction:column;gap:16px;}
.pg-elective-slot{cursor:default;}
body.compact .pg-unit,body.compact .pg-elective-slot{min-height:90px;}
.pg-unit-code{font-size:14px;}
.pg-unit-name{font-size:15.5px;line-height:1.3;}
.pg-unit-note{font-size:11.5px;}
.pg-elective-slot{font-size:13px;}
@media (max-width:640px){
  .pg-unit,.pg-elective-slot{min-height:76px;padding:7px 9px;}
  .pg-sem-units{gap:8px;}
  .pg-sem-col{padding:11px;}
  .pg-unit-code{font-size:13px;}
  .pg-unit-name{font-size:14px;}
  .pg-unit-note{font-size:10.5px;}
  .pg-elective-slot{font-size:12px;}
}
</style>
</head>
<body>
<div id="embed-root"></div>
<script>
/* ──────────────────────────────────────────────────────────────────────────
   Embeddable MPM / Graduate Diploma / Graduate Certificate semester map.
   Read-only (no elective bank, no drag-and-drop). Configure with URL params:

     ?award=masters|dip|cert          (default masters)
     &pathway=coursework|research     (default coursework; ignored for cert)
     &commencing=S1|S2                (default S1)
     &milestones=1                    show the completion banners (off by default)
     &compact=1                       shorter tiles
   ────────────────────────────────────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
const award = ['masters','dip','cert'].includes(params.get('award')) ? params.get('award') : 'masters';
const isResearch = params.get('pathway') === 'research';
const commencing = params.get('commencing') === 'S2' ? 'S2' : 'S1';
const showMilestones = params.get('milestones') === '1';
if (params.get('compact') === '1') document.body.classList.add('compact');

const PG_CORE_UNITS = {
  s1: [
    { code:'PMGT5205', name:'Professional Project Practice', cat:'tech', sem:'S1 + S2' },
    { code:'PMGT5811', name:'Critical and Systems Thinking', cat:'lead', sem:'S1 + S2' },
    { code:'PMGT5858', name:'Project Initiation', cat:'strat', sem:'S1 + S2' },
  ],
  s2: [
    { code:'PMGT5820', name:'Execution and Acceptance', cat:'tech', sem:'S1 + S2', note:'P PMGT5205 + PMGT5858 + PMGT5811' },
    { code:'PMGT5871', name:'Project Planning', cat:'tech', sem:'S1 + S2', note:'P PMGT5205 + PMGT5858 + PMGT5811' },
    { code:'PMGT5872', name:'People and Communications', cat:'lead', sem:'S1 + S2' },
  ],
  s3: [
    { code:'PMGT5850', name:'Project Management Capstone Project', cat:'tech', sem:'S1 + S2', note:'P 36cp of Core units' },
  ],
};
const PG_TOGGLE_SLOTS = {
  s1: { code:'PMGT5862', name:'Introduction to Research in Project Studies', cat:'thesis', sem:'S1 + S2', note:'Starts the Research Pathway thesis sequence' },
  s2: { code:'PMGT5883', name:'Project Studies Thesis A', cat:'thesis', sem:'S1 + S2', note:'A \u226580 in PMGT5862 and WAM \u226575 in enrolled MPM/MPPM program \u00b7 P PMGT5862', permission:true },
  s3: { code:'PMGT5884', name:'Project Studies Thesis B', cat:'thesis', sem:'S1 + S2', note:'P PMGT5883 + PMGT5862' },
};
const PG_CERT_FROM_S2 = ['PMGT5872'];
const PG_ELECTIVE_SLOTS_S3 = 2;

function calendarSem(i) { const other = commencing === 'S1' ? 'S2' : 'S1'; return i % 2 === 0 ? commencing : other; }

function offeringBadges(sem) {
  if (sem === 'S1 + S2') return '<span class="badge badge-s1">S1</span><span class="badge badge-s2">S2</span>';
  if (sem === 'S1') return '<span class="badge badge-s1">S1</span>';
  if (sem === 'S2') return '<span class="badge badge-s2">S2</span>';
  return '<span class="badge badge-tbc">Availability TBC</span>';
}
const CAT = { tech:'pg-tech', lead:'pg-lead', strat:'pg-strat', thesis:'pg-thesis' };

function unitTile(u) {
  return `<div class="pg-unit ${CAT[u.cat]}">
    <div class="pg-unit-top"><div class="pg-unit-code">${u.code}</div><div class="pg-unit-badges">${offeringBadges(u.sem)}</div></div>
    <div class="pg-unit-name">${u.name}</div>
    ${u.note ? `<div class="pg-unit-note">${u.note}</div>` : ''}
    ${u.permission ? `<div class="pg-unit-badges" style="margin-top:4px;"><span class="badge badge-permission">Departmental Permission Required</span></div>` : ''}
  </div>`;
}
const electiveSlot = () => `<div class="pg-elective-slot">Project Management Elective</div>`;
const milestone = html => showMilestones ? `<div class="pg-milestone">${html}</div>` : '';
const GRAD = '\u{1F393}';

function render() {
  let out = '';

  if (award === 'cert') {
    const units = [...PG_CORE_UNITS.s1, ...PG_CORE_UNITS.s2.filter(u => PG_CERT_FROM_S2.includes(u.code))];
    out += `<div class="pg-sem-col"><div class="pg-sem-title">Semester 1</div>
      <div class="pg-sem-units">${units.map(unitTile).join('')}</div>
      ${milestone(`<b>${GRAD} Graduate Certificate</b> \u2014 complete once all four units below are done (24cp, 4 units)`)}
    </div>`;
  } else {
    const keys = award === 'dip' ? ['s1','s2'] : ['s1','s2','s3'];
    const bases = ['Year 1 \u00b7 Semester 1', 'Year 1 \u00b7 Semester 2', 'Year 2 \u00b7 Semester 1'];
    keys.forEach((k, i) => {
      let tiles = PG_CORE_UNITS[k].map(unitTile).join('');
      if (k === 's3') for (let e = 0; e < PG_ELECTIVE_SLOTS_S3; e++) tiles += electiveSlot();
      tiles += isResearch ? unitTile(PG_TOGGLE_SLOTS[k]) : electiveSlot();

      let ms = '';
      if (k === 's2' && award === 'dip') {
        ms = milestone(`<b>${GRAD} Option to exit early \u2014 Graduate Certificate</b>: available once PMGT5205, PMGT5811, PMGT5858 and PMGT5872 are complete (24cp, 4 units)<br><b>${GRAD} Graduate Diploma</b> \u2014 complete at the end of this semester: the 6 core units above plus the 2 electives so far (48cp, 8 units)`);
      } else if (k === 's3') {
        ms = milestone(`<b>${GRAD} Master of Project Management</b> \u2014 complete at the end of this semester: 12 units in total (72cp)`);
      }
      out += `<div class="pg-sem-col"><div class="pg-sem-title">${bases[i]} <span style="font-weight:400;color:var(--text-muted);">(${calendarSem(i)})</span></div>
        <div class="pg-sem-units">${tiles}</div>${ms}</div>`;
    });
  }
  document.getElementById('embed-root').innerHTML = out;
}

// Tell a parent page how tall this content is (harmless if nothing is listening).
function reportHeight() {
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  try { parent.postMessage({ type:'pg-embed-height', height:h }, '*'); } catch (e) {}
}
render();
reportHeight();
window.addEventListener('load', reportHeight);
window.addEventListener('resize', reportHeight);
</script>
</body>
</html>
